[project]
name = "bostatest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "breno-fig", email = "brenoicarocf@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[tool.fastapi]
entrypoint = "src.main:app" #shows entrypoint


[tool.uv.workspace]
members = [
    "bostatest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]